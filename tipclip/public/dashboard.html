<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TipClip — my tips</title>
<style>
  :root { --bg:#0b0d12; --card:#151923; --ink:#f4f6fb; --muted:#8b93a7; --accent:#22c55e; --line:#232a3a; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); min-height: 100vh;
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; padding: 24px 16px; }
  .wrap { width: 100%; max-width: 440px; }
  .head { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--card);
    border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 28px; }
  .head h1 { font-size: 20px; }
  .head p { color: var(--muted); font-size: 13px; }
  .totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .tile .v { font-size: 20px; font-weight: 800; }
  .tile .k { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .payout { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 16px; display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; margin-bottom: 22px; }
  .payout .ok { color: var(--accent); font-weight: 600; }
  h2 { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 10px; }
  .tip-row { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 13px 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .tip-row .amt { font-weight: 800; font-size: 17px; }
  .tip-row .net { color: var(--accent); font-size: 12px; }
  .tip-row .when { color: var(--muted); font-size: 13px; text-align: right; }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="avatar" id="avatar">…</div>
    <div>
      <h1 id="name">&nbsp;</h1>
      <p id="role">&nbsp;</p>
    </div>
  </div>

  <div class="totals">
    <div class="tile"><div class="v" id="today">–</div><div class="k">Today</div></div>
    <div class="tile"><div class="v" id="week">–</div><div class="k">This week</div></div>
    <div class="tile"><div class="v" id="all">–</div><div class="k">All time</div></div>
  </div>

  <div class="payout">
    <span>Payout · <span id="payoutLabel"></span></span>
    <span class="ok" id="payoutMode"></span>
  </div>

  <h2>Recent tips</h2>
  <div id="feed"><div class="empty">No tips yet — go say hi 👋</div></div>
</div>

<script>
const WEARER = new URLSearchParams(location.search).get('wearer') || 'w_demo';
const fmt = (c) => (c / 100).toLocaleString('en-US', { style: 'currency', currency: 'USD' });
const ago = (iso) => {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return new Date(iso).toLocaleDateString();
};

async function load() {
  const res = await fetch(`/api/wearer/${WEARER}`);
  if (!res.ok) { document.getElementById('name').textContent = 'Wearer not found'; return; }
  const d = await res.json();
  document.getElementById('avatar').textContent = d.wearer.photo;
  document.getElementById('name').textContent = d.wearer.name;
  document.getElementById('role').textContent = d.wearer.role;
  document.getElementById('today').textContent = fmt(d.totals.todayCents);
  document.getElementById('week').textContent = fmt(d.totals.weekCents);
  document.getElementById('all').textContent = fmt(d.totals.allTimeCents);
  document.getElementById('payoutLabel').textContent = d.wearer.payout.label;
  document.getElementById('payoutMode').textContent = d.wearer.payout.instant ? '⚡ Instant' : 'Standard 1–2 days';

  if (d.recent.length) {
    document.getElementById('feed').innerHTML = d.recent.map((t) => `
      <div class="tip-row">
        <div><div class="amt">${fmt(t.amountCents)}</div><div class="net">${fmt(t.netCents)} to you</div></div>
        <div class="when">${ago(t.createdAt)}</div>
      </div>`).join('');
  }
}
load();
setInterval(load, 5000); // live-ish feed while demoing
</script>
</body>
</html>
