<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TipClip — leave a tip</title>
<style>
  :root {
    --bg: #0b0d12; --card: #151923; --ink: #f4f6fb; --muted: #8b93a7;
    --accent: #22c55e; --accent-ink: #052e12; --line: #232a3a;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); min-height: 100vh;
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
  }
  .sheet { width: 100%; max-width: 420px; }
  .brand { text-align: center; color: var(--muted); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 18px; }
  .who { text-align: center; margin-bottom: 26px; }
  .avatar {
    width: 92px; height: 92px; margin: 0 auto 12px; border-radius: 50%;
    background: var(--card); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; font-size: 46px;
  }
  .who h1 { font-size: 26px; font-weight: 700; }
  .who p { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .instant { display: inline-flex; gap: 6px; align-items: center; margin-top: 10px; font-size: 12px; color: var(--accent);
    background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.25); border-radius: 999px; padding: 4px 12px; }
  .amounts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .amt {
    background: var(--card); border: 1.5px solid var(--line); color: var(--ink);
    border-radius: 16px; padding: 18px 0; font-size: 20px; font-weight: 700; cursor: pointer;
    transition: transform .06s, border-color .12s, background .12s;
  }
  .amt:active { transform: scale(.96); }
  .amt.sel { border-color: var(--accent); background: rgba(34,197,94,.12); }
  .custom-row { display: none; margin-bottom: 14px; }
  .custom-row.open { display: flex; }
  .custom-row input {
    flex: 1; background: var(--card); border: 1.5px solid var(--accent); border-radius: 16px;
    color: var(--ink); font-size: 22px; font-weight: 700; padding: 14px 16px; text-align: center; outline: none;
  }
  .phone { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    color: var(--ink); font-size: 15px; padding: 13px 16px; outline: none; margin-bottom: 16px; }
  .phone::placeholder { color: var(--muted); }
  .pay {
    width: 100%; border: 0; border-radius: 16px; padding: 17px; font-size: 17px; font-weight: 700;
    background: var(--ink); color: var(--bg); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .pay:disabled { opacity: .4; }
  .fine { text-align: center; color: var(--muted); font-size: 12px; margin-top: 14px; }
  /* success state */
  .done { display: none; text-align: center; padding-top: 8vh; }
  .done .big { font-size: 74px; margin-bottom: 18px; }
  .done h2 { font-size: 28px; margin-bottom: 10px; }
  .done p { color: var(--muted); }
  body.tipped .tipform { display: none; }
  body.tipped .done { display: block; }
  .err { display: none; text-align: center; color: #f87171; font-size: 14px; margin-top: 12px; }
</style>
</head>
<body>
<div class="sheet">
  <div class="brand">TipClip</div>

  <div class="tipform">
    <div class="who">
      <div class="avatar" id="avatar">…</div>
      <h1 id="name">&nbsp;</h1>
      <p id="role">&nbsp;</p>
      <span class="instant" id="instant" hidden>⚡ Tips reach their bank instantly</span>
    </div>

    <div class="amounts" id="amounts"></div>
    <div class="custom-row" id="customRow">
      <input id="customInput" type="number" inputmode="decimal" min="1" max="500" placeholder="$ amount">
    </div>

    <input class="phone" id="phone" type="tel" inputmode="tel" placeholder="Your mobile # for a text receipt (optional)">

    <button class="pay" id="payBtn" disabled> Pay <span id="payAmt"></span></button>
    <div class="err" id="err"></div>
    <div class="fine">Secured by Apple Pay / Google Pay · Appears on your statement as TIPCLIP</div>
  </div>

  <div class="done">
    <div class="big">🎉</div>
    <h2 id="doneTitle">You’ve tipped!</h2>
    <p id="doneSub"></p>
  </div>
</div>

<script>
// __CLIP_ID__ is substituted by the server when served from /t/<clipId>;
// fall back to ?clip= for direct static use.
const CLIP_ID = ('__CLIP_ID__'.startsWith('__') ? null : '__CLIP_ID__')
  || new URLSearchParams(location.search).get('clip') || 'demo';

const $ = (id) => document.getElementById(id);
const fmt = (c) => (c / 100).toLocaleString('en-US', { style: 'currency', currency: 'USD' }).replace(/\.00$/, '');
let selectedCents = null;
let wearerName = '';

async function load() {
  const res = await fetch(`/api/clip/${CLIP_ID}`);
  if (!res.ok) {
    $('name').textContent = 'Clip not found';
    $('role').textContent = 'This clip hasn’t been claimed yet.';
    return;
  }
  const p = await res.json();
  wearerName = p.wearer.name;
  $('avatar').textContent = p.wearer.photo;
  $('name').textContent = p.wearer.name;
  $('role').textContent = p.wearer.role;
  $('instant').hidden = !p.instantPayout;

  const grid = $('amounts');
  for (const cents of p.presetsCents) {
    const b = document.createElement('button');
    b.className = 'amt';
    b.textContent = fmt(cents);
    b.onclick = () => select(cents, b);
    grid.appendChild(b);
  }
  const custom = document.createElement('button');
  custom.className = 'amt';
  custom.textContent = 'Custom';
  custom.onclick = () => {
    select(null, custom);
    $('customRow').classList.add('open');
    $('customInput').focus();
  };
  grid.appendChild(custom);
}

function select(cents, btn) {
  document.querySelectorAll('.amt').forEach((b) => b.classList.remove('sel'));
  btn.classList.add('sel');
  if (cents !== null) $('customRow').classList.remove('open');
  selectedCents = cents;
  updatePay();
}

$('customInput') && ($('customInput').oninput = () => {
  const v = parseFloat($('customInput').value);
  selectedCents = Number.isFinite(v) ? Math.round(v * 100) : null;
  updatePay();
});

function updatePay() {
  const ok = selectedCents >= 100 && selectedCents <= 50000;
  $('payBtn').disabled = !ok;
  $('payAmt').textContent = ok ? fmt(selectedCents) : '';
}

$('payBtn').onclick = async () => {
  $('payBtn').disabled = true;
  $('err').style.display = 'none';
  try {
    // Production: create the PaymentIntent here, then confirm it with the
    // Apple Pay / Google Pay sheet (Stripe Payment Element). The prototype's
    // mock provider settles instantly.
    const res = await fetch('/api/tip', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ clipId: CLIP_ID, amountCents: selectedCents, tipperPhone: $('phone').value.trim() || null }),
    });
    const out = await res.json();
    if (!res.ok) throw new Error(out.error || 'Payment failed');
    $('doneTitle').textContent = `You’ve tipped ${out.wearerName} ${fmt(out.amountCents)}`;
    $('doneSub').textContent = $('phone').value.trim()
      ? 'A text receipt is on its way. Thanks for making someone’s day! 💚'
      : 'Thanks for making someone’s day! 💚';
    document.body.classList.add('tipped');
  } catch (e) {
    $('err').textContent = e.message;
    $('err').style.display = 'block';
    $('payBtn').disabled = false;
  }
};

load();
</script>
</body>
</html>
