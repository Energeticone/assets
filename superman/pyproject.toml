[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "superman-orchestrator"
version = "0.1.0"
description = "Orchestrate AI agents that plan, implement, review and test — you review the final output"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.68"]

[project.scripts]
superman = "superman.cli:main"

[tool.setuptools.packages.find]
include = ["superman*"]
