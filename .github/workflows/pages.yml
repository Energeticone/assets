name: Deploy apps to GitHub Pages

on:
  push:
    branches: ["master"]
    paths:
      - "travelnow/**"
      - "rawfotra/**"
      - "flynow/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow this workflow to publish a GitHub Pages site
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages (with GitHub Actions as the source) if not already on
          enablement: true

      - name: Assemble site
        # TravelNow keeps the site root (existing URLs unchanged);
        # RAWFOTRA x1 is served under /rawfotra/, FLYNOW under /flynow/
        run: |
          mkdir -p _site
          cp -r travelnow/. _site/
          cp -r rawfotra _site/rawfotra
          cp -r flynow _site/flynow
          touch _site/.nojekyll

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
