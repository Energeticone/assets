<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FLYNOW — book your next flight</title>
  <meta name="description" content="FLYNOW — a self-contained flight-booking demo: search, pick your fare, add extras, and land on a polished confirmation page. Fictional airline, no real tickets.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%88%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" id="brandHome" aria-label="FLYNOW home">
      <span class="brand-name">FLYNOW</span>
      <span class="brand-tag">NONSTOP TO EVERYWHERE</span>
    </a>
    <div class="topbar-right">
      <span class="demo-pill" title="Fictional airline — nothing here books a real flight">DEMO</span>
      <button class="account-btn" type="button" aria-label="Account">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="10"></circle>
          <circle cx="12" cy="10" r="3.2"></circle>
          <path d="M5.5 19a7.5 7.5 0 0 1 13 0"></path>
        </svg>
      </button>
    </div>
  </header>

  <div class="stepper" id="stepper" hidden></div>

  <main class="layout">
    <section class="flow" id="flow"></section>
    <aside class="rail" id="rail" hidden></aside>
  </main>

  <footer class="foot">
    <p><strong>FLYNOW</strong> is a fictional airline built as a self-contained UI demo.
    Flights, prices and booking references are generated locally in your browser —
    nothing is purchased, reserved or sent anywhere.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
